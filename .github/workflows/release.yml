name: Release

on:
  push:
    branches: [ "main" ]

# Serialize publication without replacing pending pushes.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish the Plugin (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift environment
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          swift --version

      - name: Run Offline Checks
        run: make check

      # Semver with no manual bump; gaps in the run number are harmless.
      - name: Choose Version
        id: version
        run: echo "version=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Package and Check the Plugin
        run: make plugin VERSION="${{ steps.version.outputs.version }}"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: c1 ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/c1-plugin.zip
            dist/marketplace.json
            dist/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Claude Code sees a new version only through the marketplace entry, so main carries it:
      # `claude plugin marketplace add kiri11/c1cmd`. A GITHUB_TOKEN push starts no workflow run.
      - name: Point the Marketplace at the Release
        run: |
          git fetch --depth 1 origin "$GITHUB_REF_NAME"
          git checkout --detach FETCH_HEAD
          mkdir -p .claude-plugin
          cp dist/marketplace.json .claude-plugin/marketplace.json
          git add .claude-plugin/marketplace.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Point the marketplace at c1 ${{ steps.version.outputs.version }}"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
