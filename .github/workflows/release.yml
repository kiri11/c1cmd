name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release (macOS arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift environment
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          swift --version
          xcode-select -p
          xcodebuild -version

      - name: Run Unit Tests
        run: swift run CaptureOneCoreTests

      - name: Build Release Binaries
        run: swift build -c release -v

      - name: Package Release Archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "$RELEASE_TAG" .build/release dist

      - name: Test Packaged Archive
        run: python3 Tests/archive_test.py dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: true
          prerelease: false
          generate_release_notes: true
