name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift version and environment
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          swift --version
          xcode-select -p
          xcodebuild -version

      - name: Build Debug
        run: swift build -v

      - name: Run Unit Tests
        run: swift run --skip-build CaptureOneCoreTests

      - name: Build Release
        run: swift build -c release -v

      - name: Test MCP Contract Without Capture One
        run: python3 Tests/contract_test.py

      - name: Package and Test Release Archive
        run: |
          ./scripts/package-release.sh v0.1.0 .build/release dist
          python3 Tests/archive_test.py dist/*.tar.gz
