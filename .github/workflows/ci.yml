name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift version and environment
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          swift --version
          xcode-select -p
          xcodebuild -version

      # Release builds and relocated archive checks run in release.yml on main.
      - name: Run Offline Checks (Debug)
        run: make check
