name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version and environment
        run: |
          swift --version
          xcode-select -p

      - name: Build Debug
        run: swift build -v

      - name: Run Unit Tests
        run: swift run CaptureOneCoreTests

      - name: Build Release
        run: swift build -c release -v
