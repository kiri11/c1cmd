name: CI

# main runs the same checks in release.yml before it publishes.
on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Swift environment
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          swift --version

      - name: Run Offline Checks
        run: make check

      - name: Package and Check the Plugin
        run: make plugin
